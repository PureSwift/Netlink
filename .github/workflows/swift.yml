name: Swift

on:
  push:
    branches: [master]
  pull_request:

jobs:

  macos:
    name: macOS
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # Xcode provides the macOS SDK; the Swift 6.4 toolchain comes from swift.org.
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: "6.4.2"
    - name: Swift Version
      run: swift --version
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      run: swift test -c debug

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4-noble
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      run: swift test -c debug
